<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RMA Front Elevation Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><strong>RMA Front Elevation Designer</strong><span>AI Architectural Prototype</span></div>
  <div class="header-actions"><button id="newBtn">New</button><button id="exportBtn">Export PNG</button></div>
</header>

<div class="app">
  <aside class="left panel">
    <h3>DRAWING TOOLS</h3>
    <div class="tool-grid">
      <button class="tool active" data-tool="select">↖ Select</button>
      <button class="tool" data-tool="line">╱ Line</button>
      <button class="tool" data-tool="rect">□ Wall</button>
      <button class="tool" data-tool="window">▣ Window</button>
      <button class="tool" data-tool="door">▯ Door</button>
      <button class="tool" data-tool="balcony">⌑ Balcony</button>
    </div>
    <button id="gridBtn" class="wide">▦ Grid / Snap</button>
    <button id="undoBtn" class="wide">↶ Undo</button>

    <h3>BUILDING DATA</h3>
    <label>Building width (ft)<input id="width" type="number" value="40"></label>
    <label>Ground floor (ft)<input id="ground" type="number" value="10"></label>
    <label>First floor (ft)<input id="first" type="number" value="10"></label>
    <label>Parapet (ft)<input id="parapet" type="number" value="4"></label>
    <button id="framework" class="primary wide">Create Elevation Framework</button>

    <h3>PROJECT</h3>
    <button id="saveBtn" class="wide">Save Project JSON</button>
  </aside>

  <main id="canvasArea">
    <canvas id="elevationCanvas"></canvas>
    <div id="status">Select a tool and draw on the elevation canvas.</div>
  </main>

  <aside class="right panel">
    <h3>REFERENCE ELEVATION</h3>
    <input id="reference" type="file" accept="image/*">
    <div id="referencePreview" class="reference-preview">Upload a reference image</div>

    <h3>AI FACADE DESIGN</h3>
    <textarea id="prompt">Modern contemporary Indian residential facade. Preserve the exact building width, floor heights, doors, windows and balcony positions from my elevation. Use white plaster, natural stone cladding, wood-look vertical fins, glass railing and warm architectural lighting. Photorealistic architectural visualization.</textarea>
    <button id="aiBtn" class="primary wide">Prepare AI Render</button>

    <h3>AI REQUEST</h3>
    <pre id="aiOutput">Waiting for your elevation...</pre>
  </aside>
</div>
<script src="script.js"></script>
</body>
</html>
